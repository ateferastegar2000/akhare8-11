
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05-funcao-com-parametros.html</title>
</head>

<body>
    <h1>05-funcao-com-parametros.html</h1>
    <p id="teste">O resultado é: </p>

    <script>

        function Media(a, b, c, d) {

            var media = (a + b + c + d) / 4;

            if (media >= 7) {
                return 'aprovado com média: ' + media;
            }
            else {
                return 'reprovado com média: ' + media;
            }
        }

        var nome = '';
        var nota1 = 0, nota2 = 0, nota3 = 0, nota4 = 0;

        nome = prompt('Digite o nome do aluno', '');

        alert('Informe as 4 notas do aluno');

        nota1 = parseFloat(prompt("Digite a primeira nota", ''));
        nota2 = parseFloat(prompt("Digite a segunda nota", ''));
        nota3 = parseFloat(prompt("Digite a terceira nota", ''));
        nota4 = parseFloat(prompt("Digite a quarta nota", ''));

        document.getElementById('teste').innerHTML +=
            'O aluno ' + nome + ' está ' +
            Media(nota1, nota2, nota3, nota4);

    </script>
</body>

</html>


<!-- omo funciona agora?
- Primeiro, a função calcula a média das quatro notas.
- Depois, o if verifica se a média é maior ou igual a 7.
- Se for maior ou igual a 7, retorna aprovado.
- Se for menor que 7, retorna reprovado.
- Finalmente, mostra o nome do aluno, a situação e a média na página.
Uma coisa importante: agora a função faz duas tarefas: calcula a média e verifica se o aluno foi aprovado ou reprovado. -->
