
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício extra 16</title>
</head>

<body>

    <h1>Exercício extra 16</h1>

    <p id="resultado">Cálculo da sua idade:</p>

    <script>

        // Declaração da função
        function CalcularIdade() {

            // Solicita o nome do usuário
            var nome = prompt('Digite seu nome');

            // Pergunta se o usuário é maior ou menor de idade
            var situacao = prompt(
                'Você é maior ou menor de idade? Digite maior ou menor'
            );

            // Solicita a idade do usuário
            var idade = parseInt(prompt('Digite sua idade'));

            // Verifica se o usuário é maior de idade
            if (situacao.toLowerCase() == 'maior') {

                // Multiplica a idade por 3
                var calculo = idade * 3;

            } else {

                // Multiplica a idade por 2
                var calculo = idade * 2;

            }

            // Mostra o resultado na página
            document.getElementById('resultado').innerHTML +=
                '<br>' + nome + ', seu cálculo é: ' + calculo;

        }

        // Chama a função
        CalcularIdade();

    </script>

</body>
</html>


<!-- 1\. A função `CalcularIdade()` solicita o nome do usuário e pergunta se ele é maior ou menor de idade.

2\. O comando `prompt()` recebe as informações digitadas pelo usuário, e `parseInt()` converte a idade em número inteiro.

3\. A estrutura `if/else` verifica se o usuário é maior ou menor de idade.

4\. Se for maior de idade, a idade será multiplicada por 3; caso contrário, será multiplicada por 2.

5\. Por fim, o comando `innerHTML` mostra o nome do usuário e o resultado do cálculo na página HTML. -->
