
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício extra 15</title>
</head>

<body>

    <h1>Exercício extra 15</h1>

    <p id="resultado"></p>

    <script>

        // Declaração da função
        function MostrarFrase() {

            // Solicita um número de 1 a 30 ao usuário
            var numero = parseInt(prompt('Digite um número de 1 a 30'));

            // Verifica se o número está dentro do intervalo permitido
            if (numero >= 1 && numero <= 30) {

                // Repete a frase de acordo com o número informado
                for (var i = 1; i <= numero; i++) {

                    // Mostra a frase dentro do parágrafo
                    document.getElementById('resultado').innerHTML +=
                        'Programando em JavaScript<br>';

                }

            } else {

                // Mostra uma mensagem caso o número seja inválido
                alert('Digite um número entre 1 e 30');

            }

        }

        MostrarFrase();

    </script>

</body>
</html>


<!-- 1. A função MostrarFrase() solicita ao usuário um número entre 1 e 30 utilizando o comando prompt.

2. O comando parseInt() converte o valor digitado em um número inteiro.

3. A estrutura if verifica se o número informado está dentro do intervalo permitido.

4. O comando for repete a frase "Programando em JavaScript" de acordo com o número informado pelo usuário.

5. Por fim, o comando innerHTML exibe a frase dentro do parágrafo HTML, e cada repetição aparece em uma nova linha. -->
